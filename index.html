<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->

    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="IN-GJ" />
    <meta name="geo.placename" content="Khambhat, Gujarat, India" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.cambaycrystal.shop/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cambay Crystal" />
    <meta property="og:title" content="Cambay Crystal — Authentic Healing Crystals &amp; Gemstone Jewellery India" />
    <meta property="og:description" content="Buy authentic healing crystals, gemstone bracelets, crystal trees &amp; orgone pyramids from Khambhat, India's agate capital. Free delivery on all orders." />

    <meta property="og:image" content="https://www.cambaycrystal.shop/web-app-manifest-512x512.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cambay Crystal — Authentic Healing Crystals &amp; Gemstone Jewellery India" />
    <meta name="twitter:description" content="Buy authentic healing crystals, gemstone bracelets, crystal trees &amp; orgone pyramids from Khambhat, India's agate capital. Free delivery on all orders." />
    <meta name="twitter:image" content="https://www.cambaycrystal.shop/web-app-manifest-512x512.png" />

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.cambaycrystal.shop/#organization",
          "name": "Cambay Crystal",
          "url": "https://www.cambaycrystal.shop",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.cambaycrystal.shop/web-app-manifest-512x512.png"
          },
          "foundingDate": "2010",
          "description": "Authentic healing crystals, gemstone bracelets, crystal trees and orgone pyramids from Khambhat, Gujarat — India's agate capital.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Khambhat",
            "addressRegion": "Gujarat",
            "addressCountry": "IN"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-9724617640",
            "contactType": "customer service",
            "email": "info@cambaycrystal.shop",
            "availableLanguage": ["English", "Hindi", "Gujarati"]
          },
          "sameAs": [
            "https://www.instagram.com/cambaycrystal",
            "https://www.facebook.com/cambaycrystal"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.cambaycrystal.shop/#website",
          "url": "https://www.cambaycrystal.shop",
          "name": "Cambay Crystal",
          "publisher": { "@id": "https://www.cambaycrystal.shop/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.cambaycrystal.shop/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
